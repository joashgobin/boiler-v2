{{inline "svg-pop" `
<style>
    svg {
        height: 100%;
        width: 100%;
        object-fit: contain;
        animation: svg-pop 0.4s ease-out 1;
        transition: opacity 0.7s;
    }

    .rev svg {
        opacity: 0;
        animation: none;
    }

    .rev[data-hx-revealed] svg {
        opacity: 1;
    }

    @keyframes svg-pop {
        0% {
            transform: scale(0.0, 0.0);
        }

        40% {
            transform: scale(1.15, 1.15);
        }

        65% {
            transform: scale(0.8, 0.8);
        }

        100% {
            transform: scale(1.0, 1.0);
        }
    }
</style>
`}}
